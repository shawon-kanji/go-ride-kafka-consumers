replicaCount: 3

ingress:
  enabled: true
  className: alb
  group: go-ride-production
  path: /cab
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

serviceAccount:
  name: go-ride-app

env:
  plain:
    SERVICE_NAME: cab-request-handler
    HTTP_ADDR: ":8082"
    KAFKA_TOPIC: ride.requested.v1
    DB_NAME: go_ride
    DB_PORT: "5432"
    DB_SSLMODE: require
    # KAFKA_BROKERS, DB_HOST set from Terraform outputs for this environment
  secretRefs: []

secretsManager:
  enabled: true
  dbCredentialsSecretName: go-ride/production/db-credentials
