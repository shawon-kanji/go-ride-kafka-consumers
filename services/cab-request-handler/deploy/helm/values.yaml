image:
  repository: go-ride/cab-request-handler
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  enabled: true
  port: 8082
  targetPort: 8082

ingress:
  enabled: false
  path: /api/v1/cab
  host: ""
  className: ""
  group: ""
  annotations: {}

probes:
  enabled: true
  path: /api/v1/cab/healthz
  port: 8082

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

serviceAccount:
  create: false
  name: ""
  annotations: {}

env:
  plain:
    SERVICE_NAME: cab-request-handler
    HTTP_ADDR: ":8082"
    KAFKA_TOPIC: ride.requested.v1
    KAFKA_CANCELLED_TOPIC: ride.cancelled.v1
    DB_NAME: go_ride
    DB_PORT: "5432"
    DB_SSLMODE: disable
  secretRefs: []

secretsManager:
  enabled: false
  dbCredentialsSecretName: ""
  jwtSecretName: ""
