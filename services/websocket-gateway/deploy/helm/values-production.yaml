replicaCount: 3

ingress:
  enabled: true
  className: alb
  group: go-ride-production
  path: /api/v1/ws
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

serviceAccount:
  name: go-ride-app

env:
  plain:
    SERVICE_NAME: websocket-gateway
    HTTP_ADDR: ":8083"
    KAFKA_CONSUMER_GROUP: websocket-gateway-group
    KAFKA_OFFER_CREATED_TOPIC: driver.job_offer.created.v1
    KAFKA_ASSIGNED_TOPIC: ride.assigned.v1
    KAFKA_STARTED_TOPIC: ride.started.v1
    KAFKA_ENDED_TOPIC: ride.ended.v1
    KAFKA_COMPLETED_TOPIC: ride.completed.v1
    KAFKA_LOCATION_TOPIC: driver.location.updated.v1
    DB_NAME: go_ride
    DB_PORT: "5432"
    DB_SSLMODE: require
    REDIS_PASSWORD: ""
    JWT_ISSUER: go-ride-backend
    JWT_AUDIENCE: go-ride-driver-app
    # KAFKA_BROKERS, DB_HOST, REDIS_ADDR set from Terraform outputs for this environment
  secretRefs: []

secretsManager:
  enabled: true
  dbCredentialsSecretName: go-ride/production/db-credentials
  jwtSecretName: go-ride/production/jwt
