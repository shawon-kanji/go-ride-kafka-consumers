image:
  repository: go-ride/websocket-gateway
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  enabled: true
  port: 8083
  targetPort: 8083

ingress:
  enabled: false
  path: /api/v1/ws
  host: ""
  className: ""
  group: ""
  annotations: {}

probes:
  enabled: true
  path: /api/v1/ws/healthz
  port: 8083

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

serviceAccount:
  create: false
  name: ""
  annotations: {}

env:
  plain:
    SERVICE_NAME: websocket-gateway
    HTTP_ADDR: ":8083"
    KAFKA_CONSUMER_GROUP: websocket-gateway-group
    KAFKA_OFFER_CREATED_TOPIC: driver.job_offer.created.v1
    KAFKA_ASSIGNED_TOPIC: ride.assigned.v1
    KAFKA_STARTED_TOPIC: ride.started.v1
    KAFKA_ENDED_TOPIC: ride.ended.v1
    KAFKA_COMPLETED_TOPIC: ride.completed.v1
    KAFKA_CANCELLED_TOPIC: ride.cancelled.v1
    KAFKA_LOCATION_TOPIC: driver.location.updated.v1
    DB_NAME: go_ride
    DB_PORT: "5432"
    DB_SSLMODE: disable
    REDIS_PASSWORD: ""
    JWT_ISSUER: go-ride-backend
    JWT_DRIVER_AUDIENCE: go-ride-drivers
    JWT_RIDER_AUDIENCE: go-ride-clients
  secretRefs: []

secretsManager:
  enabled: false
  dbCredentialsSecretName: ""
  jwtSecretName: ""
