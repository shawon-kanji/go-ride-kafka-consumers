ingress:
  enabled: true
  className: nginx
  path: /api/v1/driver-trips

env:
  plain:
    SERVICE_NAME: driver-request-handler
    HTTP_ADDR: ":8084"
    KAFKA_BROKERS: kafka.go-ride-local.svc.cluster.local:9092
    KAFKA_ASSIGNED_TOPIC: ride.assigned.v1
    KAFKA_STARTED_TOPIC: ride.started.v1
    KAFKA_ENDED_TOPIC: ride.ended.v1
    KAFKA_COMPLETED_TOPIC: ride.completed.v1
    DB_HOST: postgres.go-ride-local.svc.cluster.local
    DB_NAME: go_ride
    DB_PORT: "5432"
    DB_SSLMODE: disable
    JWT_ISSUER: go-ride-backend
    JWT_AUDIENCE: go-ride-drivers
  secretRefs:
    - go-ride-local-secrets
