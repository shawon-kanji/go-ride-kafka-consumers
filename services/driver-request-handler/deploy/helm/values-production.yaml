replicaCount: 3

ingress:
  enabled: true
  className: alb
  group: go-ride-production
  path: /api/v1/driver-trips
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

serviceAccount:
  name: go-ride-app

env:
  plain:
    SERVICE_NAME: driver-request-handler
    HTTP_ADDR: ":8084"
    KAFKA_ASSIGNED_TOPIC: ride.assigned.v1
    KAFKA_STARTED_TOPIC: ride.started.v1
    KAFKA_ENDED_TOPIC: ride.ended.v1
    KAFKA_COMPLETED_TOPIC: ride.completed.v1
    DB_NAME: go_ride
    DB_PORT: "5432"
    DB_SSLMODE: require
    JWT_ISSUER: go-ride-backend
    JWT_AUDIENCE: go-ride-drivers
    # KAFKA_BROKERS, DB_HOST set from Terraform outputs for this environment
  secretRefs: []

secretsManager:
  enabled: true
  dbCredentialsSecretName: go-ride/production/db-credentials
  jwtSecretName: go-ride/production/jwt
