replicaCount: 3

ingress:
  enabled: true
  className: alb
  group: go-ride-production
  path: /api/v1/location
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

serviceAccount:
  name: go-ride-app

env:
  plain:
    SERVICE_NAME: location-producers
    HTTP_ADDR: ":8081"
    KAFKA_TOPIC: driver.location.updated.v1
    # KAFKA_BROKERS set from the MSK bootstrap brokers output for this environment
  secretRefs: []
