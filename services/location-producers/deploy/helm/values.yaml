image:
  repository: go-ride/location-producers
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  enabled: true
  port: 8081
  targetPort: 8081

ingress:
  enabled: false
  path: /location
  host: ""
  className: ""
  group: ""
  annotations: {}

probes:
  enabled: true
  path: /healthz
  port: 8081

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

serviceAccount:
  create: false
  name: ""
  annotations: {}

env:
  plain:
    SERVICE_NAME: location-producers
    HTTP_ADDR: ":8081"
    KAFKA_TOPIC: driver.location.updated.v1
  secretRefs: []

secretsManager:
  enabled: false
  dbCredentialsSecretName: ""
  jwtSecretName: ""
