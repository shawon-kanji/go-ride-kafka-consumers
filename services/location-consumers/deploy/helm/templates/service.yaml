{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "location-consumers.fullname" . }}
  labels:
    {{- include "location-consumers.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  selector:
    {{- include "location-consumers.selectorLabels" . | nindent 4 }}
{{- end }}
